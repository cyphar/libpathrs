on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: lint-gha-zizmor

env:
  ZIZMOR_VERSION: "v1.7.12"

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          # Fail the job directly (with inline annotations) rather than
          # uploading SARIF results, which requires GitHub code scanning.
          advanced-security: false
          annotations: true
