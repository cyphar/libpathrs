on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: lint-renovate

env:
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  RENOVATE_VERSION: "44.181.7"
  RENOVATE_DIGEST: "sha256:4f5a2621afd6629fda621e5c66221d1000f0ef3330ec14c828d7e8d357f03522"

permissions:
  contents: read

jobs:
  renovate-config-validator:
    name: renovate-config-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run renovate-config-validator
        run: |-
          docker run --rm \
            --cap-drop=all --user 65534:65534 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            "ghcr.io/renovatebot/renovate:$RENOVATE_VERSION@$RENOVATE_DIGEST" \
            renovate-config-validator --strict
