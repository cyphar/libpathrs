on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: lint-gha-actionlint

env:
  ACTIONLINT_VERSION: "v1.17.0"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # NOTE: shellcheck is pre-installed on GitHub's Ubuntu runners, so
      # actionlint will also lint run: scripts.
      - name: run actionlint
        run: go run "actionlint.kjanat.dev/cmd/actionlint@$ACTIONLINT_VERSION"
