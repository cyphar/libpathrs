on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: lint-gha

env:
  ACTIONLINT_VERSION: "v1.7.12"

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          # Fail the job directly (with inline annotations) rather than
          # uploading SARIF results, which requires GitHub code scanning.
          advanced-security: false
          annotations: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # NOTE: shellcheck is pre-installed on GitHub's Ubuntu runners, so
      # actionlint will also lint run: scripts.
      - name: run actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
